openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HostelX account, chat, and private image API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Predefined resident accounts and profiles
  - name: users
    description: Owner-only account administration
  - name: chats
    description: Admin-controlled conversations
  - name: storage
    description: Private resident and chat photos
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a predefined HostelX account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many sign-in attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current signed-in resident
      responses:
        "200":
          description: Current session, or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and revoke the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/setup:
    post:
      operationId: completeFirstLoginSetup
      tags: [auth]
      summary: Complete required first-login profile and password setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstLoginSetupInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          description: Invalid setup information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Display identity is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the current resident's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [users]
      summary: List the 50 predefined accounts for the owner
      responses:
        "200":
          description: Registered accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a resident password to a one-time temporary password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password, shown once to the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}/role:
    patch:
      operationId: setUserRole
      tags: [users]
      summary: Grant or remove an additional administrator role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /chats:
    get:
      operationId: listChats
      tags: [chats]
      summary: List chats visible to the signed-in resident
      responses:
        "200":
          description: Chats the resident may access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createChat
      tags: [chats]
      summary: Create a chat and assign its exact member list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "201":
          description: Created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          description: Invalid chat or member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /chats/{chatId}:
    patch:
      operationId: updateChat
      tags: [chats]
      summary: Rename, change the photo, or archive a chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUpdateInput"
      responses:
        "200":
          description: Updated chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteChat
      tags: [chats]
      summary: Delete a chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Chat deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /chats/{chatId}/members:
    post:
      operationId: addChatMembers
      tags: [chats]
      summary: Add registered members to a chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMembersInput"
      responses:
        "200":
          description: Updated chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Chat or account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /chats/{chatId}/members/{userId}:
    delete:
      operationId: removeChatMember
      tags: [chats]
      summary: Remove a member from a chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Chat or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /chats/{chatId}/messages:
    get:
      operationId: listChatMessages
      tags: [chats]
      summary: List messages in a chat the resident can access
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Chat not found or not assigned to this resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: sendChatMessage
      tags: [chats]
      summary: Send a message to an assigned chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Chat not found or not assigned to this resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required for chat images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/complete:
    post:
      operationId: completeUpload
      tags: [storage]
      summary: Mark an uploaded image private and owned by the current resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadInput"
      responses:
        "200":
          description: Upload is ready to use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompleteResult"
        "400":
          description: Invalid or incomplete upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectId}:
    get:
      operationId: getPrivateObject
      tags: [storage]
      summary: Read a profile or chat image the resident is allowed to see
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private image bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Image access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    LoginInput:
      type: object
      properties:
        loginId:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [loginId, password]
    User:
      type: object
      properties:
        internalId:
          type: string
        loginId:
          type: string
        displayName:
          type: [string, "null"]
        displayId:
          type: [string, "null"]
        role:
          type: string
          enum: [owner, admin, user]
        firstLogin:
          type: boolean
        profilePhotoPath:
          type: [string, "null"]
        about:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required: [internalId, loginId, displayName, displayId, role, firstLogin, profilePhotoPath, about, createdAt]
    CurrentSession:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [user]
    UserList:
      type: array
      items:
        $ref: "#/components/schemas/User"
    FirstLoginSetupInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
        profilePhotoPath:
          type: [string, "null"]
        about:
          type: [string, "null"]
      required: [displayName, newPassword]
    ProfileUpdateInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        profilePhotoPath:
          type: [string, "null"]
        about:
          type: [string, "null"]
    RoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
      required: [role]
    ResetPasswordResponse:
      type: object
      properties:
        temporaryPassword:
          type: string
      required: [temporaryPassword]
    ChatMember:
      type: object
      properties:
        internalId:
          type: string
        loginId:
          type: string
        displayName:
          type: [string, "null"]
        displayId:
          type: [string, "null"]
        role:
          type: string
          enum: [owner, admin, user]
        profilePhotoPath:
          type: [string, "null"]
      required: [internalId, loginId, displayName, displayId, role, profilePhotoPath]
    Chat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        photoPath:
          type: [string, "null"]
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/ChatMember"
      required: [id, name, photoPath, archived, createdAt, members]
    ChatList:
      type: array
      items:
        $ref: "#/components/schemas/Chat"
    ChatInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        memberIds:
          type: array
          items:
            type: string
          minItems: 1
        photoPath:
          type: [string, "null"]
      required: [name, memberIds]
    ChatUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        photoPath:
          type: [string, "null"]
        archived:
          type: boolean
    ChatMembersInput:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
          minItems: 1
      required: [userIds]
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        chatId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, chatId, senderId, senderName, text, createdAt]
    MessageList:
      type: array
      items:
        $ref: "#/components/schemas/ChatMessage"
    MessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required: [text]
    UploadUrlInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
        purpose:
          type: string
          enum: [profile, chat]
      required: [name, size, contentType, purpose]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]
    CompleteUploadInput:
      type: object
      properties:
        objectPath:
          type: string
          minLength: 1
      required: [objectPath]
    UploadCompleteResult:
      type: object
      properties:
        objectPath:
          type: string
      required: [objectPath]

